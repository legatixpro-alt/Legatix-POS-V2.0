<!doctype html>
<html lang="es">
  <head>
    <script>
      // Suppress benign [vite] websocket connection messages and errors in dev environment
      (function() {
        const isViteWs = (msg) => {
          if (!msg) return false;
          try {
            const s = typeof msg === 'object' ? (msg.message || msg.reason || '') : String(msg);
            return s.includes('[vite]') || s.includes('failed to connect to websocket') || s.includes('WebSocket connection to') || s.includes('server connection lost');
          } catch (e) {
            return false;
          }
        };
        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(m) {
          const orig = console[m];
          if (typeof orig === 'function') {
            console[m] = function(...args) {
              if (args.some(isViteWs)) return;
              orig.apply(console, args);
            };
          }
        });
        window.addEventListener('error', function(e) {
          if (isViteWs(e.message) || isViteWs(e.filename)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWs(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
